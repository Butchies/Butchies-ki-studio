name: Setup.exe bauen

on:
  push:
    branches: [main, release/5.0]
    paths:
      - 'installer/**'
      - 'server/**'
      - 'windows/**'
      - 'VERSION'
      - 'modelle.json'
      - '.github/workflows/setup-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell-Dateien auf Fehler prüfen
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem windows\*.ps1) {
            $err = $null; [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err)
            foreach ($e in $err) { Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { throw "$bad Syntaxfehler gefunden" }
      - name: ps2exe installieren
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
      - name: Paket in Setup einbetten
        shell: powershell
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "pkg\butchies-ki-studio"
          New-Item -ItemType Directory -Force -Path "$tmp\windows" | Out-Null
          Copy-Item -Recurse installer, server -Destination $tmp
          Copy-Item VERSION, modelle.json, Anleitung.pdf, ANLEITUNG.md -Destination $tmp
          Copy-Item windows\Butchies-KI.ps1 "$tmp\windows\"
          $zip = Join-Path $env:RUNNER_TEMP "payload.zip"
          Compress-Archive -Path $tmp -DestinationPath $zip -Force
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($zip))
          $src = [IO.File]::ReadAllText("windows\Setup.ps1")
          $src = $src.Replace('"__PAYLOAD__"', '"' + $b64 + '"')
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\Setup-komplett.ps1", $src, (New-Object Text.UTF8Encoding($true)))
      - name: Butchies-KI-Setup.exe erstellen
        shell: powershell
        run: |
          Import-Module ps2exe
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v.Split(".").Count -eq 3) { $v += ".0" }
          Invoke-ps2exe -inputFile "$env:RUNNER_TEMP\Setup-komplett.ps1" -outputFile Butchies-KI-Setup.exe -noConsole -requireAdmin -iconFile windows\logo.ico `
            -title "Butchies KI Studio Setup" -product "Butchies KI Studio" -company "Butchies" -version $v
      - uses: actions/upload-artifact@v4
        with:
          name: Butchies-KI-Setup
          path: Butchies-KI-Setup.exe
      - name: EXE als Vorabversion veröffentlichen
        if: github.ref == 'refs/heads/release/5.0'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v5.0.0-preview"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --prerelease --title "Butchies KI Studio 5.0 Vorschau" --notes "Entwicklungsstand, nicht auf Hardware getestet."
            if ($LASTEXITCODE -ne 0) { throw "Release konnte nicht erstellt werden" }
          }
          gh release upload $tag Butchies-KI-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "EXE-Upload fehlgeschlagen" }
      - name: Setup.exe ins Repo legen (download/)
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path download | Out-Null
          Copy-Item Butchies-KI-Setup.exe download\Butchies-KI-Setup.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Butchies-KI-Setup.exe
          git commit -m "Setup.exe automatisch gebaut" ; if ($LASTEXITCODE -eq 0) { git push }
          exit 0
